name: Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - autoscroll-fix

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      CI: true
      GRADLE_OPTS: "-Xmx4g -Dkotlin.daemon.jvm.options=-Xmx2g"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Disable lint
        run: echo "android.enableLint=false" >> gradle.properties

      - name: Build APK
        run: |
          ./gradlew assembleGoogleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dantotsu-APK
          path: app/build/outputs/apk/google/debug/app-google-debug.apk

      - name: Send APK to Telegram
        run: |
          curl -F chat_id=5431714552 \
               -F document=@app/build/outputs/apk/google/debug/app-google-debug.apk \
               -F caption="Dantotsu APK Build Completed" \
               "https://api.telegram.org/bot8229731748:AAE4U84_8TnrHt3W9a5FUr05I9BWi6w-UQc/sendDocument"
